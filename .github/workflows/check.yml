name: Check connector

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm pack --json
      - uses: actions/upload-artifact@v4
        with:
          name: connector-package
          path: n8n-nodes-saasthinktank-*.tgz
          if-no-files-found: error
