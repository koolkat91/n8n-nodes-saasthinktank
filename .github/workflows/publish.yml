name: Stage reviewed release

# Configure npm publishing and the npm-release environment before dispatching.
# This workflow runs only when a maintainer explicitly starts a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'koolkat91/n8n-nodes-saasthinktank' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Use npm with staged publishing support
        run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Stage with source provenance
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm stage publish --access public --provenance
        env:
          RELEASE_MODE: 'true'
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
